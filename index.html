<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migoo × Shopee · for Seller · 素材 + 选品 + 经营分析</title>
<style>
:root{--ink:#1f1f2e;--sub:#767686;--line:#e6e6ee;--bg:#f6f6fa;--p:#5b3fd6;--p-bg:#ece8fd;--org:#d4380d;--org-bg:#fff1ec}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 -apple-system,"PingFang SC","Helvetica Neue",Roboto,"Noto Sans SC",Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* top bar */
.top{display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 40%,#fff 0 18%,transparent 19%),radial-gradient(circle at 65% 40%,#fff 0 18%,transparent 19%),linear-gradient(135deg,#6a5cf0,#3aa0ff)}
.logo .x{color:#aaa;font-weight:400;font-size:13px}
.logo .shopee{background:#ee4d2d;color:#fff;padding:2px 10px;border-radius:6px;font-size:16px}
.title{color:var(--sub);font-size:16px}
.sp{flex:1}
.toptabs{display:flex;gap:6px}
.toptabs button{padding:8px 16px;border-radius:10px;color:var(--sub);font-weight:500}
.toptabs button.on{background:var(--p-bg);color:var(--p)}
.toptabs button:disabled{opacity:.45;cursor:not-allowed}
/* scene bar */
.bar{margin:14px 24px 0;display:flex;align-items:center;gap:16px;flex:none;flex-wrap:wrap}
.scenes{display:flex;gap:4px;background:#ebebf2;border-radius:12px;padding:4px}
.scenes button{padding:8px 18px;border-radius:9px;font-weight:700;color:#555}
.scenes button small{font-weight:400;color:#9a9aa8;margin-left:6px;font-size:12px}
.scenes button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--p)}
.hint{color:#555}
.zoom{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--sub);font-size:13px}
.zoom button{padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.zoom button.on{border-color:var(--p);color:var(--p)}
/* plan strip */
.plans{margin:12px 24px 0;display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px dashed #f0b8a8;background:#fffaf8;border-radius:12px;flex:none;flex-wrap:wrap}
.plans.neutral{border-color:var(--line);background:#fff}
.plans .lbl{font-weight:700;color:var(--org)}
.plans.neutral .lbl{color:#333}
.plans .lbl em{font-style:normal;color:var(--sub);font-weight:400;margin-left:6px}
.chip{padding:5px 14px;border:1px solid var(--line);border-radius:18px;background:#fff;color:#444}
.chip.on{background:var(--org-bg);border-color:#ffb9a3;color:var(--org);font-weight:600}
.plans.neutral .chip.on{background:var(--p-bg);border-color:#c9bffa;color:var(--p)}
.desc{margin-left:auto;color:var(--sub);font-size:13px}
/* canvas */
.canvas{flex:1;min-height:0;margin:12px 24px 18px;border:1px solid var(--line);border-radius:14px;background:#e9e9ef;overflow:auto;display:flex;justify-content:center;padding:18px}
.holder{position:relative;flex:none;overflow:hidden}
iframe{border:0;background:#fff;transform-origin:0 0;position:absolute;left:0;top:0;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.foot{position:fixed;right:34px;bottom:26px;display:flex;gap:8px}
.foot button{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:16px}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><i></i>Migoo <span class="x">×</span><span class="shopee">Shopee</span></div>
  <div class="title">for Seller · 素材 + 选品 + 经营分析</div>
  <div class="sp"></div>
  <div class="toptabs">
    <button class="on">① Seller Centre PC</button>
    <button disabled title="暂无设计稿">② Seller Centre App</button>
  </div>
</div>

<div class="bar">
  <div class="scenes" id="scenes"></div>
  <span class="hint" id="hint"></span>
  <div class="zoom">缩放
    <button id="zfit" class="on">适应宽度</button><button id="z100">100%</button>
  </div>
</div>

<div class="plans" id="plans"></div>

<div class="canvas" id="canvas"><div class="holder" id="holder"><iframe id="frame" title="design"></iframe></div></div>

<div class="foot"><button id="prev" title="上一个方案 (←)">‹</button><button id="next" title="下一个方案 (→)">›</button></div>

<script>
const P = 'pages/';
const SCENES = [
  {id:'material', name:'优化素材', sub:'AIGC · 文本', hint:'My Products 编辑页：文本素材优化入口', label:'方案', neutral:true, plans:[
    {name:'Product Details', file:'01-text-product-details.html', w:1366, h:2511, desc:'商品详情编辑页'}]},
  {id:'select', name:'选品', sub:'新品录入 · 商品机会', hint:'选品页面：Add New Product 与 Product Opportunities', label:'页面', neutral:true, pages:[
    {name:'Add New Product', hint:'Add New Product · 新品录入', plans:[
      {name:'方案一 · 真实 prompt 诉求轮播', file:'02-selection-guide-a.html', w:1356, h:1903, viewH:925, offset:0, desc:'真实 prompt 诉求轮播'},
      {name:'方案二 · 简单工具入口', file:'02-selection-guide-a.html', w:1356, h:1903, viewH:925, offset:978, desc:'简单工具入口'}]},
    {name:'Product Opportunities', hint:'Product Opportunities · 商品机会推荐', plans:[
      {name:'Product Opportunities', file:'03-selection-guide-b.html', w:1356, h:925, desc:'卖什么 · 商品机会推荐'}]}
  ]},
  {id:'insight', name:'商品经营分析', sub:'首页洞察 · 商品管理', hint:'按页面场景查看经营分析方案', label:'页面', neutral:true, pages:[
    {name:'Seller Center 首页 · Business Insights', hint:'Seller Center 首页 · Business Insights', planLabel:'本场景方案', plans:[
      {name:'方案一', file:'04-business-analysis-1.html', w:1366, h:922},
      {name:'方案二', file:'05-business-analysis-2.html', w:1366, h:922}]},
    {name:'My Product · 商品列表', hint:'My Product · 商品列表页', planLabel:'本场景方案', plans:[
      {name:'方案三', file:'06-business-analysis-3.html', w:1366, h:917},
      {name:'方案四', file:'07-business-analysis-4.html', w:1366, h:917},
      {name:'方案五', file:'08-business-analysis-5.html', w:1366, h:917}]}
  ]},
  {id:'drawer', name:'右侧助手 · 抽屉', sub:'Seller Assistant × Migoo', hint:'与场景无关的另一个维度：右侧助手如何承接 Migoo', label:'右侧助手', neutral:false, plans:[
    {name:'方案一 · 区分入口', file:'10-drawer-1.html', w:1366, h:922, desc:'opt 1：区分入口'},
    {name:'方案二 · 一个入口 A', file:'11-drawer-2.html', w:1366, h:922, desc:'opt 2：一个入口，区分功能入口'},
    {name:'方案二 · 一个入口 B', file:'12-drawer-3.html', w:1366, h:922, desc:'opt 2：一个入口，区分功能入口（变体）'}]},
];

let si = 0, pi = 0, pageIndex = 0, fit = true;
const $ = id => document.getElementById(id);

function renderScenes(){
  $('scenes').innerHTML = SCENES.map((s,i)=>`<button class="${i===si?'on':''}" data-i="${i}">${s.name}<small>${s.sub}</small></button>`).join('');
  $('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>{si=+b.dataset.i;pi=0;pageIndex=0;go()});
}
function currentPlan(){
  const s = SCENES[si];
  return s.pages ? s.pages[pageIndex].plans[pi] : s.plans[pi];
}
function renderPlans(){
  const s = SCENES[si];
  const el = $('plans');
  el.className = 'plans' + (s.neutral?' neutral':'');
  if(s.pages){
    const page = s.pages[pageIndex];
    el.innerHTML = `<span class="lbl">页面</span>` +
      s.pages.map((p,i)=>`<button class="chip ${i===pageIndex?'on':''}" data-page="${i}">${p.name}</button>`).join('') +
      (page.plans.length>1 ? `<span class="lbl">${page.planLabel||'本场景方案'}</span>` + page.plans.map((p,i)=>`<button class="chip ${i===pi?'on':''}" data-plan="${i}">${p.name}</button>`).join('') : '') +
      `<span class="desc">${page.plans[pi].desc||''}</span>`;
    el.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{pageIndex=+b.dataset.page;pi=0;go()});
    el.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{pi=+b.dataset.plan;go()});
    return;
  }
  el.innerHTML = `<span class="lbl">${s.neutral?'方案切换':'另一个维度 · 右侧助手：Seller Assistant × Migoo'}<em>${s.neutral?'':'和场景无关 →'}</em></span>` +
    s.plans.map((p,i)=>`<button class="chip ${i===pi?'on':''}" data-i="${i}">${p.name}</button>`).join('') +
    `<span class="desc">${s.plans[pi].desc||''}</span>`;
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{pi=+b.dataset.i;go()});
}
function layout(){
  const p = currentPlan();
  const cw = $('canvas').clientWidth - 36;
  const k = fit ? Math.min(1, cw / p.w) : 1;
  const f = $('frame');
  f.style.width = p.w+'px'; f.style.height = p.h+'px'; f.style.top = -(p.offset||0)+'px';
  f.style.transform = `scale(${k})`;
  $('holder').style.width = p.w*k+'px'; $('holder').style.height = (p.viewH||p.h)*k+'px';
  $('canvas').scrollTop = 0;
}
function go(push=true){
  const s = SCENES[si], p = currentPlan();
  renderScenes(); renderPlans();
  $('hint').textContent = s.pages ? s.pages[pageIndex].hint : s.hint;
  const f = $('frame');
  if (f.dataset.file !== p.file){ f.src = P + p.file; f.dataset.file = p.file; }
  layout();
  if (push) history.replaceState(null,'',s.pages ? `#${s.id}/${pageIndex+1}/${pi+1}` : `#${s.id}/${pi+1}`);
}
function allChoices(){
  const out=[];
  SCENES.forEach((s,sceneIndex)=>{
    if(s.pages) s.pages.forEach((page,pageIndex)=>page.plans.forEach((_,planIndex)=>out.push({si:sceneIndex,pageIndex,pi:planIndex})));
    else s.plans.forEach((_,planIndex)=>out.push({si:sceneIndex,pageIndex:0,pi:planIndex}));
  });
  return out;
}
function step(d){
  const choices=allChoices();
  const current=choices.findIndex(c=>c.si===si && c.pageIndex===pageIndex && c.pi===pi);
  const next=choices[(current+d+choices.length)%choices.length];
  si=next.si;pageIndex=next.pageIndex;pi=next.pi;
  go();
}
$('zfit').onclick = ()=>{fit=true;$('zfit').classList.add('on');$('z100').classList.remove('on');layout()};
$('z100').onclick = ()=>{fit=false;$('z100').classList.add('on');$('zfit').classList.remove('on');layout()};
$('prev').onclick = ()=>step(-1); $('next').onclick = ()=>step(1);
addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')step(-1); if(e.key==='ArrowRight')step(1) });
addEventListener('resize',layout);
new ResizeObserver(layout).observe($('canvas'));
(function init(){
  const m = location.hash.match(/^#(\w+)\/(\d+)(?:\/(\d+))?$/);
  if (m){
    const i = SCENES.findIndex(s=>s.id===m[1]);
    if(i>=0){
      si=i;
      const s=SCENES[i];
      if(s.pages){
        pageIndex=Math.max(0,Math.min(s.pages.length-1,+m[2]-1));
        pi=Math.max(0,Math.min(s.pages[pageIndex].plans.length-1,+(m[3]||1)-1));
      } else pi=Math.max(0,Math.min(s.plans.length-1,+m[2]-1));
    }
  }
  go(false);
})();
</script>
</body>
</html>
